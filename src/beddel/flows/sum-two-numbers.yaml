# =============================================================================
# Sum Two Numbers — minimal flow demo with A2UI output
# =============================================================================
#
# Receives two numbers as input, uses LLM to compute the sum
# (demonstrating the pipeline), and returns result via A2UI surface.
#
# Usage (CLI):
#   beddel run src/beddel-py/src/beddel/flows/sum-two-numbers.yaml \
#     -i a="7" -i b="3"
#
# =============================================================================

id: sum_two_numbers
name: Sum Two Numbers
description: Receives two numbers and returns their sum via A2UI surface.
version: "1.0"
interaction: interactive

input_schema:
  type: object
  properties:
    a:
      type: string
      description: First number.
    b:
      type: string
      description: Second number.
  required:
    - a
    - b

steps:
  - id: compute_sum
    primitive: llm
    config:
      model: gemini-2.5-flash
      prompt: |
        You are a calculator. Compute the sum of these two numbers:
        First number: $input.a
        Second number: $input.b
        Return ONLY the numeric result, nothing else.
      temperature: 0.0
      max_tokens: 16
    timeout: 15.0

  - id: show_result
    primitive: output-generator
    config:
      format: a2ui
      template:
        surfaceUpdate:
          id: sum-result
          components:
            - type: Text
              id: title
              props:
                content: "Sum Result"
                variant: h2
            - type: Text
              id: operation
              props:
                content: "$input.a + $input.b"
                variant: body1
            - type: Text
              id: result
              props:
                content: "$stepResult.compute_sum.content"
                variant: h3
